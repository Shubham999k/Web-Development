<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All-Assignments-by-Subbhi</title>
     <link
      class=""
      rel="icon"
      type="image/png"
      href="/Cravings_by_Subbhi/assets/images/favicon.png"
    />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap"
      rel="stylesheet"
    />

    <!-- My CSS -->
    <link rel="stylesheet" href="style.css" /> 
  </head>

  <body>
    <h1 class="text-center mt-4">All Assignments</h1>

    <div class="container mt-5 px-lg-5">
      <div class="row g-4 justify-content-center align-items-stretch">
        <!-- ===== CARD 1 ===== -->
        <div class="col-lg-4 col-md-6 d-flex">
          <div class="custom-card w-100 d-flex flex-column text-center">  
            <!-- ICON -->
            <div class="icon-wrapper">
              <i class="bi bi-person-plus-fill card-icon"></i>
            </div>

            <!-- TITLE -->
            <h3 class="card-title">Assignment 1</h3>

            <!-- CONTENT -->
            <div class="content">
              <input
                type="text"
                class="form-control mb-3"
                id="name"
                placeholder="Enter Name"
              />
              <input
                type="text"
                class="form-control mb-3"
                id="city"
                placeholder="Enter City"
              />
            </div>

            <!-- BUTTON -->
            <button class="btn btn-primary w-100 mb-auto border-0 py-2" onclick="submit1()">
              Submit
            </button>

            <!-- RESULT -->
            <div id="result1" class=" mt-3"></div>
          </div>
        </div>

        <!-- ===== CARD 2 ===== -->
        <div class="col-lg-4 col-md-6 d-flex">
          <div
            class="custom-card w-100 d-flex flex-column text-center"
            id="formBox"
          >
            <div class="icon-wrapper">
              <i class="bi bi-envelope-fill card-icon"></i>
            </div>

            <h3 class="card-title">Assignment 2</h3>

            <div class="content">
              <input
                type="email"
                class="form-control mb-3"
                id="email"
                placeholder="Enter Email"
              />
              <input
                type="password"
                class="form-control mb-3"
                id="password"
                placeholder="Enter Password"
              />
            </div>

            <button class="btn btn-success w-100 mb-auto border-0 py-2" onclick="submit2()">
              Submit
            </button>

            <div id="result2" class=" mt-3"></div>
          </div>
        </div>

        <!-- ===== CARD 3 ===== -->
        <div class="col-lg-4 col-md-6 d-flex">
          <div class="custom-card w-100 d-flex flex-column text-center">
            <div class="icon-wrapper">
              <i class="bi bi-person-fill card-icon"></i>
            </div>

            <h3 class="card-title">Assignment 3</h3>

            <div class="content ">
              <input
                type="text"
                class="form-control mb-3"
                id="fname"
                placeholder="First Name"
              />
              <input
                type="text"
                class="form-control mb-3"
                id="lname"
                placeholder="Last Name"
              />
            </div>

            <button class="btn btn-warning w-100 mb-auto py-2 border-0 text-white" onclick="submit3()">
              Submit
            </button>

            <div id="result3" class=" mt-3"></div>
          </div>
        </div>
      </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Your JS -->
    <script src="script2.js"></script>
  </body>
</html>
