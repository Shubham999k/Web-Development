<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Weather App</title>

    <!-- Bootstrap -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- CSS -->

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <video autoplay muted loop playsinline class="bg-video">
      <source
        src="https://videos.pexels.com/video-files/857195/857195-hd_1920_1080_25fps.mp4"
        type="video/mp4"
      />
    </video>
    <!-- Overlay -->

    <div class="video-overlay"></div>

    <div class="container-fluid main-container">
      <div class="row weather-layout">
        <!-- Left Side -->

        <div
          class="col-lg-4 left-side d-flex align-items-center justify-content-center"
        >
          <div class="weather-card p-4">
            <!-- Header -->

            <div class="text-center mb-4">
              <img
                src="https://cdn-icons-png.flaticon.com/512/1779/1779940.png"
                alt="Weather Icon"
                class="weather-icon mb-3"
              />

              <h1 class="title">Mausam Ka Haal</h1>

              <p class="sub-title">Live Weather Forecast</p>
            </div>

            <!-- Input -->

            <div class="mb-4">
              <label class="text-white mb-2">
                <i class="bi bi-geo-alt-fill"></i>

                Enter City Name
              </label>

              <input
                type="text"
                id="cityName"
                class="form-control custom-input"
                placeholder="Example : Satna"
              />
            </div>

            <!-- Button -->

            <button
              onclick="getWeather()"
              class="btn btn-light w-100 search-btn"
            >
              <i class="bi bi-search"></i>

              Get Weather
            </button>
          </div>
        </div>

        <!-- Right Side -->

        <div
          class="col-lg-8 right-side d-flex align-items-center justify-content-center"
        >
          <div class="weather-result">
            <!-- Main Temperature -->

            <div class="weather-data text-center mb-4">
              <h1><span id="Temperature">28</span>°C</h1>

              <p id="weatherCondition">
                <i class="bi bi-cloud-sun-fill"></i>

                Clear Sky
              </p>
            </div>

            <!-- Info Cards -->

            <div class="row g-4">
              <!-- Humidity -->

              <div class="col-md-4">
                <div class="info-box">
                  <i class="bi bi-droplet-half"></i>

                  <h5>Humidity</h5>

                  <p id="humidity">65%</p>
                </div>
              </div>

              <!-- Wind -->

              <div class="col-md-4">
                <div class="info-box">
                  <i class="bi bi-wind"></i>

                  <h5>Wind</h5>

                  <p id="wind">12 km/h</p>
                </div>
              </div>

              <!-- Feels Like -->

              <div class="col-md-4">
                <div class="info-box">
                  <i class="bi bi-thermometer-half"></i>

                  <h5>Feels Like</h5>

                  <p id="feelsLike">30°C</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
