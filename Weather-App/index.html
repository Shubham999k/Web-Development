<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather-App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="bg-primary w-100 text-center py-2 text-white">
      <h2>Mausem Ka Haal 🔜 💖 </h2>
    </header>

    <div
      class="w-100 d-flex align-items-center justify-content-center gap-4 mt-3"
    >
      <div>
        <img src="./image.png" height="550" alt="" class="border" />
      </div>
      <div class="d-grid gap-4 bg-info-subtle h-100 border card p-5 border border-5 border-info rounded-4">
        <div>
          <label for="city">City Name:</label>
          <input
            type="text"
            id="cityName"
            class="form-control bg-transparent border border-2 border-danger"
            placeholder="Enter Your City"
          />
        </div>
        <button onclick="getWeather()" class="btn btn-outline-success">
          Get Weather
        </button>

        <div>
          <label>Temp : <span id="Temperature">🔥</span>ºC</label>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
