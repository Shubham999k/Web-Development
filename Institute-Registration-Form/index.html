<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <header class="fixed-top shadow-sm">
      <div class="bg-primary p-3 text-center">
        <h2 class="text-light">Institute Registration Form</h2>
      </div>
    </header>
    <main class="py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-10">
            <div class="card shadow-lg main-card">
              <!-- Header -->
              <div class="bg-primary text-white p-4 text-center">
                <h1 class="fw-bold">Institute Registration Form</h1>

                <p class="mb-0">Complete all details carefully</p>
              </div>

              <!-- Body -->
              <div class="card-body p-5">
                <form id="registrationFrom">
                  <!-- PERSONAL INFO -->
                  <div class="section-title">Personal Information</div>

                  <div class="row g-4">
                    <!-- FULL NAME -->
                    <div class="col-md-6">
                      <label class="form-label fw-bold"> Full Name </label>

                      <input
                        type="text"
                        id="fullName"
                        class="form-control"
                        placeholder="Enter full name"
                      />

                      <div id="fullNameError" class="error-text"></div>
                    </div>

                    <!-- EMAIL -->
                    <div class="col-md-6">
                      <label class="form-label fw-bold"> Email </label>

                      <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter email"
                      />

                      <div id="emailError" class="error-text"></div>
                    </div>

                    <!-- PHONE -->
                    <div class="col-md-6">
                      <label class="form-label fw-bold"> Mobile Number </label>

                      <input
                        type="text"
                        id="phone"
                        class="form-control"
                        placeholder="9876543210"
                      />

                      <div id="phoneError" class="error-text"></div>
                    </div>

                    <!-- DOB -->
                    <div class="col-md-6">
                      <label class="form-label fw-bold"> Date Of Birth </label>

                      <input type="date" id="dob" class="form-control" />

                      <div id="dobError" class="error-text"></div>
                    </div>
                  </div>

                  <!-- GENDER -->
                  <div class="mt-4">
                    <label class="fw-bold mb-3"> Gender </label>

                    <div class="d-flex gap-4">
                      <div class="form-check">
                        <input
                          type="radio"
                          name="gender"
                          value="Male"
                          class="form-check-input"
                        />

                        <label class="form-check-label"> Male </label>
                      </div>

                      <div class="form-check">
                        <input
                          type="radio"
                          name="gender"
                          value="Female"
                          class="form-check-input"
                        />

                        <label class="form-check-label"> Female </label>
                      </div>

                      <div class="form-check">
                        <input
                          type="radio"
                          name="gender"
                          value="Others"
                          class="form-check-input"
                        />

                        <label class="form-check-label"> Others </label>
                      </div>
                    </div>

                    <div id="genderError" class="error-text"></div>
                  </div>

                  <!-- ACADEMIC -->
                  <div class="section-title mt-5">Academic Information</div>

                  <div class="row g-4">
                    <!-- QUALIFICATION -->
                    <div class="col-md-6">
                      <label class="form-label fw-bold"> Qualification </label>

                      <select id="qualification" class="form-select">
                        <option value="">Select Qualification</option>

                        <option>10th</option>

                        <option>12th</option>

                        <option>Graduation</option>
                      </select>

                      <div id="qualificationError" class="error-text"></div>
                    </div>

                    <!-- MARKS -->
                    <div class="col-md-6">
                      <label class="form-label fw-bold"> Percentage </label>

                      <input
                        type="text"
                        id="marks"
                        class="form-control"
                        placeholder="Enter percentage"
                      />

                      <div id="marksError" class="error-text"></div>
                    </div>
                  </div>

                  <!-- BUTTONS -->
                  <div class="d-flex gap-3 mt-5">
                    <button
                      type="reset"
                      class="btn btn-outline-secondary w-50 reset-btn"
                    >
                      Reset
                    </button>

                    <button
                      type="submit"
                      class="btn btn-primary w-50 submit-btn"
                    >
                      Submit Registration
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
