<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Guessing Number Game</title>

    <!-- Bootstrap CSS -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- CSS -->

    <link rel="stylesheet" href="style.css" />
  </head>

  <body
    class="min-vh-100 d-flex justify-content-center align-items-center bg-light p-3"
  >
    <!-- ================= MAIN CARD ================= -->

    <div class="card shadow-lg border-0 rounded-5 p-4 game-card">
      <!-- ================= HEADING ================= -->

      <h1 class="text-center fw-bold mb-2 text-primary">
        Guessing Number Game
      </h1>

      <p class="text-center text-secondary mb-4">
        Guess a number between 1 and 100 🎯
      </p>

      <!-- ================= INPUT ================= -->

      <div class="mb-4">
        <label class="form-label fw-semibold">
          Enter Your Guess
        </label>

        <input
          type="number"
          id="guessInput"
          class="form-control form-control-lg rounded-4"
          placeholder="Enter number"
        />
      </div>

      <!-- ================= BUTTONS ================= -->

      <div class="d-grid gap-3">
        <button
          class="btn btn-primary btn-lg rounded-4 fw-bold"
          onclick="checkGuess()"
        >
          Check Guess
        </button>

        <button
          class="btn btn-danger btn-lg rounded-4 fw-bold"
          onclick="restartGame()"
        >
          Restart Game
        </button>
      </div>

      <!-- ================= RESULT ================= -->

      <div
        id="result"
        class="alert alert-info rounded-4 mt-4 text-center fw-bold"
      >
        Start guessing... 🤔
      </div>

      <!-- ================= ATTEMPTS ================= -->

      <div class="text-center mt-3">
        <h5 id="attempts">
          Attempts : 0
        </h5>
      </div>
    </div>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS -->

    <script src="script.js"></script>
  </body>
</html>
