<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tip Calculator</title>

    <!-- Bootstrap CSS -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- CSS -->

    <link rel="stylesheet" href="style.css" />
  </head>

  <body
    class="min-vh-100 d-flex justify-content-center align-items-center bg-light p-3"
  >
    <!-- ================= MAIN CARD ================= -->

    <div class="card shadow-lg border-0 rounded-5 p-4 calc-card">
      <!-- ================= HEADING ================= -->

      <h1 class="text-center fw-bold mb-2 text-primary">
        Tip Calculator
      </h1>

      <p class="text-center text-secondary mb-4">
        Calculate your restaurant tip easily 🍽️
      </p>

      <!-- ================= BILL AMOUNT ================= -->

      <div class="mb-3">
        <label class="form-label fw-semibold">
          Bill Amount
        </label>

        <input
          type="number"
          id="billAmount"
          class="form-control form-control-lg rounded-4"
          placeholder="Enter bill amount"
        />
      </div>

      <!-- ================= SERVICE ================= -->

      <div class="mb-3">
        <label class="form-label fw-semibold">
          How was the service?
        </label>

        <select
          id="service"
          class="form-select form-select-lg rounded-4"
        >
          <option value="0">Choose Service</option>
          <option value="25">Top Notch - 25%</option>
          <option value="20">Excellent - 20%</option>
          <option value="15">Good - 15%</option>
          <option value="10">Average - 10%</option>
        </select>
      </div>

      <!-- ================= PEOPLE ================= -->

      <div class="mb-4">
        <label class="form-label fw-semibold">
          Number of People
        </label>

        <input
          type="number"
          id="people"
          class="form-control form-control-lg rounded-4"
          placeholder="Enter number of people"
        />
      </div>

      <!-- ================= BUTTON ================= -->

      <button
        class="btn btn-primary btn-lg rounded-4 w-100 fw-bold"
        onclick="calculateTip()"
      >
        Calculate Tip
      </button>

      <!-- ================= RESULT ================= -->

      <div
        id="result"
        class="mt-4 text-center d-none"
      >
        <div class="alert alert-success rounded-4">
          <h4 class="fw-bold mb-3">
            Result 💰
          </h4>

          <h5 id="tipAmount"></h5>

          <h5 id="totalAmount"></h5>

          <h5 id="perPerson"></h5>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS -->

    <script src="script.js"></script>
  </body>
</html>
