<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age calculator</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="w-25 bg-light rounded shadow border mx-auto mt-5 p-4 d-flex flex-column gap-2">
      <h1 class="text-primary text-center">Age Calculator</h1>
      <form class="d-flex flex-column align-items-center w-100 gap-4">
        <label for="dob">Enter Your Date of Birth</label>
        <input type="date" name="DOB" id="DOB" class="form-control w-100">
        <label for="CurrentDate">Choose Current Date</label>
        <input type="date" class="currentDate form-control w-100 " id="CurrentDate">
        <button class="btn btn-primary" >Calculate Age</button>

      </form>
      <div class="fw-bold"><span  id="Age">Your Age is : XX Years</span></div>
    </div>

    <!-- bootstrap Strap = Remember to always written above the comment -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
