<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CurrencyFlow</title>

    <!-- Bootstrap -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Google Font -->

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Background Video -->

    <video autoplay muted loop playsinline class="bg-video">
      <source src="./bg-video.mp4" type="video/mp4" />
    </video>

    <!-- Overlay -->

    <div class="video-overlay"></div>

    <!-- Navbar -->

    <nav class="navbar navbar-dark px-4 py-3">
      <h2 class="logo">
        <i class="bi bi-currency-exchange"></i>

        CurrencyFlow
      </h2>
    </nav>

    <!-- Main Container -->

    <div class="container-fluid main-container">
      <div class="row h-100">
        <!-- Left Side -->

        <div class="col-lg-4 d-flex align-items-center justify-content-center">
          <div class="currency-card p-4">
            <div class="text-center mb-4">
              <div class="icon-box mb-3">
                <i class="bi bi-cash-stack"></i>
              </div>

              <h1 class="title">Currency Convertor</h1>

              <p class="sub-title">Real Time Currency Exchange</p>
            </div>

            <!-- Amount -->

            <div class="mb-3">
              <label class="text-white mb-2"> Enter Amount </label>

              <input
                type="number"
                id="amount"
                class="form-control custom-input"
                placeholder="Enter Amount"
              />
            </div>

            <!-- From -->

            <div class="mb-3">
              <label class="text-white mb-2"> From Currency </label>

              <div class="d-flex align-items-center gap-3">
                <img id="flag1" src="" alt="" />

                <select id="country1" class="form-select custom-input"></select>
              </div>
            </div>

            <!-- Swap -->

            <div class="text-center my-3">
              <button id="swapBtn">
                <i class="bi bi-arrow-left-right"></i>
              </button>
            </div>

            <!-- To -->

            <div class="mb-4">
              <label class="text-white mb-2"> To Currency </label>

              <div class="d-flex align-items-center gap-3">
                <img id="flag2" src="" alt="" />

                <select id="country2" class="form-select custom-input"></select>
              </div>
            </div>

            <!-- Error -->

            <p id="error" class="text-danger mb-3"></p>

            <!-- Button -->

            <button id="convertBtn" class="btn btn-light w-100 convert-btn">
              <span id="btnText"> Convert Currency </span>

              <span id="loader" class="spinner-border spinner-border-sm d-none">
              </span>
            </button>
          </div>
        </div>

        <!-- Right Side -->

        <div class="col-lg-8 d-flex align-items-center justify-content-center">
          <div class="result-card text-center">
            <i class="bi bi-graph-up-arrow result-icon"></i>

            <h2 class="mt-3 text-white">Converted Amount</h2>

            <h1 id="newAmount" class="result-value">₹0.00</h1>

            <div class="rate-card mt-4">
              <p id="exchangeRate">1 USD = 83.50 INR</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
